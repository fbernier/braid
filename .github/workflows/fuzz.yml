name: fuzz

# A separate workflow rather than a job in `ci.yml`, because `paths` is a
# workflow-level filter: a pull request that touches only the client has no
# business paying for a nightly toolchain and a Ghostty build.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/proto/**"
      - "crates/dgram/**"
      - "crates/server/**"
      - "crates/vt/**"
      # `fuzz/Cargo.toml` depends on `braid-sim`, so a breaking change here
      # compiles clean on the pull request and only reds the nightly cron.
      - "crates/sim/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      # One failing target must not hide the others: a run reports every
      # target that found something, not the first.
      fail-fast: false
      matrix:
        target:
          - client_message_decode
          - server_message_decode
          - frame_reader
          - frame_reader_reuse
          - screen_parts
          - wire_unpack
          - dgram_recv
          - dgram_schedule
          - vt_feed
          - deferred_osc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # libFuzzer needs the sanitizer runtime, which is nightly-only.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz

      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
        with:
          tool: cargo-fuzz

      # The working corpus is not in the repository — a minute of fuzzing from
      # nothing rediscovers a frame header and little else. Carrying it between
      # runs is what turns ten one-minute runs into ten minutes of coverage.
      # `fuzz/seeds` is the committed floor underneath it, so a cache miss
      # still starts from every input a past crash was minimised to.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # `mkdir` because `actions/cache` does not create the path it missed, and
      # libFuzzer refuses a corpus directory that does not exist: a miss killed
      # the whole run rather than falling back to `fuzz/seeds`, which is the
      # entire reason those are committed. The corpus directory stays *first*,
      # because libFuzzer writes new findings to that one and reads the rest.
      - run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=60

      # The crashing input is the whole finding: without it the runner is
      # destroyed and all that survives is "the fuzzer failed".
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
